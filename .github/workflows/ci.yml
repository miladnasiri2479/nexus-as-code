name: CI Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  lint-and-validate:
    name: Lint & Syntax Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ansible-lint yamllint
          ansible-galaxy collection install community.docker amazon.aws

      - name: YAML Lint
        run: yamllint .

      - name: Validate all.yml Structure & Feature Flags
        run: |
          chmod +x scripts/validate_config.py
          python3 scripts/validate_config.py

      - name: Ansible Lint
        # Skip rules that might conflict with our specific design (like role names needing certain prefixes if applicable, though we strive for standard)
        run: ansible-lint -q

  dry-run:
    name: Ansible Dry Run (--check)
    runs-on: ubuntu-latest
    needs: lint-and-validate
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Ansible
        run: |
          sudo apt-get update
          sudo apt-get install -y ansible
          ansible-galaxy collection install community.docker amazon.aws

      - name: Setup Mock Inventory & Config
        # We copy the sample inventory to simulate a production run safely
        run: |
          cp -r inventory/sample inventories/production
          sed -i 's/ansible_host=192.168.1.100/ansible_connection=local/g' inventories/production/hosts.yml

      - name: Syntax Check Playbooks
        run: |
          ansible-playbook -i inventories/production/hosts.yml playbooks/site.yml --syntax-check
          ansible-playbook -i inventories/production/hosts.yml playbooks/drift_audit.yml --syntax-check

      - name: Dry Run Base Flow
        # We run in check mode. Some tasks (like asserting docker is running) will fail 
        # because docker isn't configured by the playbook in check mode. 
        # So we skip the preflight role during this generic dry-run.
        run: |
          ansible-playbook -i inventories/production/hosts.yml playbooks/site.yml --check --skip-tags "preflight"
