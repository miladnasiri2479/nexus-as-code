---
name: CI Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  lint-and-validate:
    name: Lint & Syntax Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ansible-lint yamllint
          ansible-galaxy collection install community.docker community.general ansible.posix

      - name: YAML Lint
        run: yamllint .

      - name: Ansible Lint
        run: ansible-lint -q

  dry-run:
    name: Ansible Dry Run (--check)
    runs-on: ubuntu-latest
    needs: lint-and-validate
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Ansible
        run: |
          sudo apt-get update
          sudo apt-get install -y ansible
          ansible-galaxy collection install community.docker community.general ansible.posix

      - name: Syntax Check Playbooks
        run: |
          ansible-playbook -i inventories/production/inventory.yml playbooks/nexus_deploy.yml --syntax-check
          ansible-playbook -i inventories/production/inventory.yml playbooks/nexus_install.yml --syntax-check
          ansible-playbook -i inventories/production/inventory.yml playbooks/nexus_configure.yml --syntax-check
          ansible-playbook -i inventories/production/inventory.yml playbooks/nexus_validate.yml --syntax-check
