---
name: CI Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  lint-and-validate:
    name: Lint & Syntax Validation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-lint-${{ hashFiles('.github/workflows/ci.yml') }}
          restore-keys: |
            ${{ runner.os }}-pip-lint-

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ansible-lint yamllint

      - name: YAML Lint
        run: yamllint .

      - name: Ansible Lint
        run: ansible-lint -q

  dry-run:
    name: Ansible Dry Run (--check)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: lint-and-validate
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-lint-${{ hashFiles('.github/workflows/ci.yml') }}
          restore-keys: |
            ${{ runner.os }}-pip-lint-

      - name: Install Ansible
        run: pip install ansible-core

      - name: Install Ansible Collections
        run: ansible-galaxy collection install -r requirements.yml --force

      - name: Syntax Check Playbooks
        run: |
          ansible-playbook -i inventories/production/inventory.yml playbooks/nexus_deploy.yml --syntax-check
          ansible-playbook -i inventories/production/inventory.yml playbooks/nexus_install.yml --syntax-check
          ansible-playbook -i inventories/production/inventory.yml playbooks/nexus_configure.yml --syntax-check
          ansible-playbook -i inventories/production/inventory.yml playbooks/nexus_validate.yml --syntax-check
