###############################################################################
# APT (Debian/Ubuntu)
###############################################################################

# ─── APT Proxy (Ubuntu) ─────────────────────────────────────────────────────
- name: ubuntu-proxy
  # Recipe: Ubuntu APT repository mirror.
  format: apt
  type: proxy
  remote_url: https://archive.ubuntu.com/ubuntu
  blob_store_name: default
  cleanup_policy: ""
  online: true
  strict_content_validation: true
  distribution: focal
  # Ubuntu codename: focal, jammy, noble, etc.
  # Type: string
  signing:
    # GPG signing configuration for APT repos.
    # Type: dict
    key:
      # Path to GPG public key file.
      # Type: string
      publicKey: ""
    # Path to GPG private key file for signing.
    # Type: string
    publicKeyring: ""

# ─── APT Proxy (Debian) ────────────────────────────────────────────────────
- name: debian-proxy
  # Recipe: Debian APT repository mirror.
  format: apt
  type: proxy
  remote_url: https://deb.debian.org/debian
  blob_store_name: default
  cleanup_policy: ""
  online: true
  strict_content_validation: true
  distribution: bookworm
  # Debian codename: bookworm, bullseye, etc.
  # Type: string
  signing:
    key:
      publicKey: ""

# ─── APT Hosted ─────────────────────────────────────────────────────────────
- name: apt-hosted
  # Recipe: internal Debian/Ubuntu packages.
  format: apt
  type: hosted
  write_policy: allow
  blob_store_name: default
  cleanup_policy: ""
  online: true
  strict_content_validation: true
  distribution: focal
  signing:
    key:
      publicKey: ""


