###############################################################################
# repositories.yml — Nexus Repository Templates
# ============================================================================
# Reference file: defines ALL supported repository types with recipes.
#
# This file is NOT directly consumed by Ansible.
# It serves as a template catalog — users copy entries into their
# inventory's nexus_repos list (Section 8 of nexus.yml).
#
# Each recipe includes every field supported by the Nexus REST API
# for that format/type combination.
#
# How to use:
#   1. Find the repository type you need below
#   2. Copy the relevant dict
#   3. Paste into inventories/<env>/group_vars/nexus.yml → nexus_repos: [...]
#   4. Customize name, blob_store_name, cleanup_policy, remote_url
###############################################################################


###############################################################################
# DOCKER
###############################################################################

# ─── Docker Proxy (Docker Hub) ───────────────────────────────────────────────
- name: docker-hub
  # Recipe: standard Docker Hub mirror.
  # Clients pull through Nexus; cache reduces bandwidth and adds resilience.
  # Type: string
  format: docker
  type: proxy
  remote_url: https://registry-1.docker.io
  # Docker Hub v2 registry endpoint.
  # Type: string
  blob_store_name: default
  cleanup_policy: ""
  online: true
  strict_content_validation: false
  v1_enabled: false
  force_basic_auth: false
  compress: true
  cache_max_age_in_minutes: 1440
  # Cache TTL in minutes (24 hours). Lower = fresher but more upstream calls.
  # Type: int
  index_type: dockerhub
  # Docker Hub index type.
  #   dockerhub — public Docker Hub (uses Docker's official index)
  #   registry  — custom registry (set index_url below)
  # Type: string
  index_url: ""

# ─── Docker Proxy (Quay.io) ─────────────────────────────────────────────────
- name: quay-proxy
  # Recipe: Red Hat Quay.io container registry mirror.
  format: docker
  type: proxy
  remote_url: https://quay.io
  blob_store_name: default
  cleanup_policy: ""
  online: true
  strict_content_validation: false
  v1_enabled: false
  force_basic_auth: false
  compress: true
  cache_max_age_in_minutes: 1440
  index_type: registry
  # Quay uses its own index.
  index_url: https://quay.io/api/v1
  # Quay index API endpoint.
  # Type: string

# ─── Docker Proxy (GitHub Container Registry) ────────────────────────────────
- name: ghcr-proxy
  # Recipe: GitHub Container Registry mirror.
  # Supports both public and private images (with auth token).
  format: docker
  type: proxy
  remote_url: https://ghcr.io
  blob_store_name: default
  cleanup_policy: ""
  online: true
  strict_content_validation: false
  v1_enabled: false
  force_basic_auth: false
  compress: true
  cache_max_age_in_minutes: 1440
  index_type: registry
  index_url: https://ghcr.io
  # GHCR does not expose a public index; Nexus uses the registry directly.
  # Type: string

# ─── Docker Proxy (Kubernetes Registry) ──────────────────────────────────────
- name: k8s-registry-proxy
  # Recipe: Kubernetes official container registry mirror.
  # Registry: registry.k8s.io
  format: docker
  type: proxy
  remote_url: https://registry.k8s.io
  blob_store_name: default
  cleanup_policy: ""
  online: true
  strict_content_validation: false
  v1_enabled: false
  force_basic_auth: false
  compress: true
  cache_max_age_in_minutes: 1440
  index_type: registry
  index_url: https://registry.k8s.io

# ─── Docker Proxy (Red Hat Registry) ────────────────────────────────────────
- name: redhat-registry-proxy
  # Recipe: Red Hat Container Registry (registry.redhat.io).
  # Requires Red Hat subscription authentication.
  format: docker
  type: proxy
  remote_url: https://registry.redhat.io
  blob_store_name: default
  cleanup_policy: ""
  online: true
  strict_content_validation: false
  v1_enabled: false
  force_basic_auth: false
  compress: true
  cache_max_age_in_minutes: 1440
  index_type: registry
  index_url: https://registry.redhat.io

# ─── Docker Proxy (Harbor) ──────────────────────────────────────────────────
- name: harbor-proxy
  # Recipe: Harbor instance mirror.
  # Replace remote_url with your Harbor URL.
  format: docker
  type: proxy
  remote_url: https://harbor.internal
  # Replace with your Harbor URL.
  # Type: string
  blob_store_name: default
  cleanup_policy: ""
  online: true
  strict_content_validation: false
  v1_enabled: false
  force_basic_auth: true
  # Harbor typically requires auth for pulls.
  # Type: bool
  compress: true
  cache_max_age_in_minutes: 1440
  index_type: registry
  index_url: https://harbor.internal

# ─── Docker Proxy (Elastic) ─────────────────────────────────────────────────
- name: elastic-registry-proxy
  # Recipe: Elastic container registry mirror.
  # Registry: docker.elastic.co
  format: docker
  type: proxy
  remote_url: https://docker.elastic.co
  blob_store_name: default
  cleanup_policy: ""
  online: true
  strict_content_validation: false
  v1_enabled: false
  force_basic_auth: false
  compress: true
  cache_max_age_in_minutes: 1440
  index_type: registry
  index_url: https://docker.elastic.co

# ─── Docker Hosted ──────────────────────────────────────────────────────────
- name: docker-hosted
  # Recipe: private Docker images pushed by your CI/CD or developers.
  # Clients push here; group routes pulls.
  format: docker
  type: hosted
  write_policy: allow
  # allow = permit redeploy (Docker tags are mutable).
  # Type: string
  blob_store_name: default
  cleanup_policy: docker-cleanup
  # Attach a cleanup policy defined in Section 10 of nexus.yml.
  # Type: string
  online: true
  strict_content_validation: false
  # Docker content validation is lenient by default.
  # Type: bool
  v1_enabled: false
  force_basic_auth: false
  http_port: 0
  # 0 = use main Nexus port. Set e.g. 5000 for dedicated Docker port.
  # Type: int
  https_port: 0
  compress: true

# ─── Docker Group ────────────────────────────────────────────────────────────
- name: docker-group
  # Recipe: aggregate hosted + proxy repos into a single pull endpoint.
  # Clients configure this single URL as their Docker registry.
  format: docker
  type: virtual
  # Virtual = group (Nexus 3 uses "virtual" for groups via REST API).
  # Type: string
  blob_store_name: default
  cleanup_policy: ""
  online: true
  strict_content_validation: false
  v1_enabled: false
  force_basic_auth: false
  http_port: 0
  https_port: 0
  compress: true
  member_repos:
    # Ordered: hosted first (private), then proxy (upstream).
    # First match wins for layer resolution.
    # Type: list[string]
    - docker-hosted
    - docker-hub


###############################################################################
# MAVEN (Java)
###############################################################################

# ─── Maven Central Proxy ─────────────────────────────────────────────────────
- name: maven-central
  # Recipe: official Maven Central mirror.
  # Caches all public Maven artifacts locally.
  format: maven2
  type: proxy
  remote_url: https://repo1.maven.org/maven2
  blob_store_name: default
  cleanup_policy: ""
  online: true
  strict_content_validation: true
  version_policy: release
  # "release" = stable releases only.
  # Type: string
  layout_policy: permissive
  # "permissive" = accept any layout (proxy should not enforce).
  # Type: string
  cache_max_age_in_minutes: 1440

# ─── Maven Central (UK Mirror) ──────────────────────────────────────────────
- name: maven-central-uk
  # Recipe: UK mirror of Maven Central (faster for European deployments).
  format: maven2
  type: proxy
  remote_url: https://uk.maven.org/maven2
  blob_store_name: default
  cleanup_policy: ""
  online: true
  strict_content_validation: true
  version_policy: release
  layout_policy: permissive
  cache_max_age_in_minutes: 1440

# ─── Google Maven Proxy ──────────────────────────────────────────────────────
- name: google-maven
  # Recipe: Google's Maven repository (Android, Firebase, etc.).
  format: maven2
  type: proxy
  remote_url: https://maven.google.com
  blob_store_name: default
  cleanup_policy: ""
  online: true
  strict_content_validation: true
  version_policy: release
  layout_policy: permissive
  cache_max_age_in_minutes: 1440

# ─── Maven Hosted (Releases) ────────────────────────────────────────────────
- name: maven-releases
  # Recipe: internal releases. Each version deployed once.
  format: maven2
  type: hosted
  write_policy: allow_once
  # allow_once = immutable releases.
  # Type: string
  blob_store_name: default
  cleanup_policy: ""
  online: true
  strict_content_validation: true
  version_policy: release
  layout_policy: strict
  # strict = enforce proper Maven layout.
  # Type: string

# ─── Maven Hosted (Snapshots) ───────────────────────────────────────────────
- name: maven-snapshots
  # Recipe: internal snapshots. Redeploys allowed.
  format: maven2
  type: hosted
  write_policy: allow
  blob_store_name: default
  cleanup_policy: maven-snapshot-cleanup
  online: true
  strict_content_validation: false
  version_policy: snapshot
  layout_policy: permissive

# ─── Maven Group ─────────────────────────────────────────────────────────────
- name: maven-public
  # Recipe: aggregate all Maven repos into one endpoint.
  format: maven2
  type: virtual
  blob_store_name: default
  cleanup_policy: ""
  online: true
  strict_content_validation: true
  version_policy: release
  layout_policy: permissive
  member_repos:
    - maven-releases
    - maven-snapshots
    - maven-central


