###############################################################################
# QUICK REFERENCE: SUPPORTED FORMATS
###############################################################################
#
# Format        | Proxy URL Example                                    | Hosted | Group
# --------------|------------------------------------------------------|--------|------
# docker        | https://registry-1.docker.io                         | ✅     | ✅
# maven2        | https://repo1.maven.org/maven2                       | ✅     | ✅
# npm           | https://registry.npmjs.org                            | ✅     | ✅
# pypi          | https://pypi.org/simple                               | ✅     | ✅
# helm          | https://charts.helm.sh/stable                         | ✅     | ✅
# nuget         | https://api.nuget.org/v3/index.json                   | ✅     | ✅
# apt           | https://archive.ubuntu.com/ubuntu                     | ✅     | ❌
# yum           | https://mirror.centos.org/centos/8/...                | ✅     | ❌
