#
#
# QUICK REFERENCE: RECIPE FIELD DEFINITIONS
#
# Field                       | Type     | Applies To       | Description
# ----------------------------|----------|------------------|------------------------------------------
# name                        | string   | all              | Unique repository name (required)
# format                      | string   | all              | Package format (required)
# type                        | string   | all              | hosted | proxy | virtual
# remote_url                  | string   | proxy            | Upstream URL (required for proxy)
# blob_store_name             | string   | all              | Target blob store
# cleanup_policy              | string   | all              | Cleanup policy name
# online                      | bool     | all              | Accessible to clients
# strict_content_validation   | bool     | all              | Validate uploads
# write_policy                | string   | hosted           | allow | allow_once | deny
# version_policy              | string   | maven2           | release | snapshot
# layout_policy               | string   | maven2           | strict | permissive
# cache_max_age_in_minutes    | int      | proxy            | Cache TTL
# v1_enabled                  | bool     | docker           | Enable Docker V1 API
# force_basic_auth            | bool     | docker           | Require auth for push
# http_port                   | int      | docker           | Dedicated HTTP port
# https_port                  | int      | docker           | Dedicated HTTPS port
# compress                    | bool     | docker           | Compress layers
# index_type                  | string   | docker (proxy)   | dockerhub | registry
# index_url                   | string   | docker (proxy)   | Custom index URL
# allow_redeploy              | bool     | helm             | Allow chart redeploy
# deploy_policy               | string   | yum              | permissive | strict
# repodata_depth              | int      | yum              | Repodata fetch depth
# distribution                | string   | apt              | Debian/Ubuntu codename
# signing                     | dict     | apt              | GPG signing config
# member_repos                | list     | virtual          | Member repository names
