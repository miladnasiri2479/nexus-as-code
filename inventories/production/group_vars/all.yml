---
# ==============================================================================
# NEXUS AS CODE - SINGLE SOURCE OF TRUTH (GROUP VARS / ALL.YML)
# ==============================================================================

# ==========================================
# 1. CORE NEXUS SETTINGS & CREDENTIALS
# ==========================================
nexus:
  hostname: "nexus.mycompany.local"
  version: "3.68.0"

  # Admin Credentials
  admin_user: "admin"
  admin_password: "SuperSecretPassword123!" # Required: Min 8 chars

  # External Database Credentials (Used if cluster is enabled)
  db_url: "jdbc:postgresql://postgres.internal:5432/nexus"
  db_user: "nexus"
  db_password: "SecretDatabasePassword"

  # Core runtime values
  http_port: 8081
  data_dir: "/opt/nexus-data"
  network_name: "nexus_network"
  container_name: "nexus"
  anonymous_access: false
  base_url: "https://nexus.mycompany.local"
  active_realms:
    - "NexusAuthenticatingRealm"
    - "DockerToken"
    - "NexusAuthorizingRealm"

# ==========================================
# 2. FEATURE FLAGS & MODULE CONFIGURATIONS
# ==========================================
features:
  storage:
    enabled: true
  blobstores:
    enabled: true
  repositories:
    enabled: true

  cluster:
    enabled: false
    replicas: 3

  loadbalancer:
    enabled: false

  scaling:
    enabled: false

  monitoring:
    enabled: false
    metrics_enabled: true
    user: "nexus_monitor"
    password: "SecureMonitorPassword123!"

  backup:
    enabled: false
    schedule: "0 2 * * *"
    retention_days: 7
    destination: "local" # local, s3, minio
    bucket: "nexus-backups"
    access_key: "BACKUP_AKIA"
    secret_key: "BACKUP_SECRET"
    region: "us-east-1"
    endpoint: "" # Only needed for minio

# ==========================================
# 3. STORAGE SETTINGS (If external storage used)
# ==========================================
storage:
  type: "file" # local, s3, or minio
  bucket: "nexus-artifacts"
  access_key: "STORAGE_AKIA"
  secret_key: "STORAGE_SECRET"
  region: "us-east-1"
  endpoint: ""

# ==========================================
# 4. TRAEFIK (EDGE PROXY)
# ==========================================
traefik:
  enabled: true
  version: "v2.10"
  domain: "{{ nexus.hostname }}"
  letsencrypt: false
  email: "admin@mycompany.local"
  dashboard_enabled: false
  config_dir: "/opt/traefik"

# ==========================================
# 5. BLOBSTORES OVERRIDES
# ==========================================
blobstores:
  default:
    enabled: true
  docker:
    enabled: true
  maven:
    enabled: true

# ==========================================
# 6. REPOSITORIES OVERRIDES
# ==========================================
repositories:
  docker_hub:
    enabled: true
    blobstore: "docker"
  maven_central:
    enabled: true
    blobstore: "maven"
  npm_registry:
    enabled: false
  pypi_org:
    enabled: false
  helm_charts:
    enabled: false
