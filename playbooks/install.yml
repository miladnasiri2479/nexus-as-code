---
- name: Install and Deploy Nexus Infrastructure
  hosts: all
  become: true
  gather_facts: true

  pre_tasks:
    - name: Verify supported OS
      ansible.builtin.assert:
        that: ansible_os_family in ['Debian', 'RedHat']
        msg: "This OS is not supported by this playbook."

  roles:
    - role: preflight
      tags: ['preflight', 'setup']
    
    - role: nexus_deploy
      tags: ['nexus', 'deploy']
    
    - role: traefik
      when: traefik is defined and (traefik.enabled | default(false) | bool)
      tags: ['traefik', 'proxy']
