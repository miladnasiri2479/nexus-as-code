###############################################################################
# Nexus as Code - Restore Playbook
# ============================================================================
# Restore Nexus from backup.
#
# Usage:
#   ansible-playbook -i inventories/production/inventory.yml playbooks/nexus_restore.yml \
#     -e "nexus_restore_source=/var/nexus/backup/nexus-backup-20240101_020000.tar.gz"
###############################################################################

- name: Restore Nexus Repository Manager
  hosts: nexus
  become: true
  gather_facts: true

  roles:
    - role: nexus_restore
      tags: [nexus, restore]
