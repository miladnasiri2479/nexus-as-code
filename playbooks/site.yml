---
# playbooks/site.yml
# ==============================================================================
# NEXUS AS CODE - MAIN ENTRYPOINT
# ==============================================================================
# This playbook orchestrates the deployment and configuration of Sonatype Nexus.
# Execution order strictly follows the System Contract DAG.

- name: Phase 1 - Infrastructure Provisioning
  hosts: nexus_servers
  become: true
  gather_facts: true
  
  pre_tasks:
    - name: Verify Supported OS Family
      ansible.builtin.assert:
        that: ansible_os_family in ['Debian', 'RedHat']
        msg: "Unsupported OS. Only Debian and RedHat families are supported."
        quiet: true
      tags: ['always']

  roles:
    - role: preflight
      tags: ['preflight', 'validate']
    
    - role: nexus_deploy
      tags: ['nexus', 'deploy']

# ------------------------------------------------------------------------------
# Phase 2 - API Configuration
# ------------------------------------------------------------------------------

- name: Phase 2 - API Configuration & Security
  hosts: nexus_servers
  become: false  # API calls run from localhost to Nexus port, root not strictly required
  gather_facts: false
  roles:
    - role: nexus_bootstrap
      tags: ['api', 'bootstrap', 'security']

