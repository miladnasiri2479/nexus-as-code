---
# playbooks/site.yml
# ==============================================================================
# NEXUS AS CODE - MAIN ENTRYPOINT
# ==============================================================================
# This playbook orchestrates the deployment and configuration of Sonatype Nexus.
# Execution order strictly follows the System Contract DAG.

- name: Phase 1 - Infrastructure Provisioning
  hosts: nexus_servers
  become: true
  gather_facts: true
  
  pre_tasks:
    - name: Verify Supported OS Family
      ansible.builtin.assert:
        that: ansible_os_family in ['Debian', 'RedHat']
        msg: "Unsupported OS. Only Debian and RedHat families are supported."
        quiet: true
      tags: ['always']

  roles:
    - role: preflight
      tags: ['preflight', 'validate']
    
    - role: nexus_deploy
      tags: ['nexus', 'deploy']

# ------------------------------------------------------------------------------
# Phase 2 - API Configuration & Security
# ------------------------------------------------------------------------------

- name: Phase 2 - API Configuration & Security
  hosts: nexus_servers
  become: false  # API calls run from localhost to Nexus port, root not strictly required
  gather_facts: false
  roles:
    - role: nexus_bootstrap
      tags: ['api', 'bootstrap', 'security']

# ------------------------------------------------------------------------------
# Phase 3 - Storage & Repositories
# ------------------------------------------------------------------------------

- name: Phase 3 - Storage & Repositories
  hosts: nexus_servers
  become: false
  gather_facts: false
  roles:
    - role: storage
      tags: ['storage', 'validate']
      
    - role: nexus_blobstores
      tags: ['storage', 'blobstores']
      
    - role: nexus_repositories
      tags: ['repos', 'repositories']

# ------------------------------------------------------------------------------
# Phase 4 - Edge Routing & Hardening
# ------------------------------------------------------------------------------

- name: Phase 4 - Edge Routing & Hardening
  hosts: nexus_servers
  become: true
  gather_facts: false
  roles:
    - role: traefik
      when: traefik is defined and (traefik.enabled | default(false) | bool)
      tags: ['proxy', 'traefik']
      
    - role: security_hardening
      tags: ['security', 'hardening']
