---
# playbooks/site.yml
# ==============================================================================
# NEXUS AS CODE - FEATURE FLAG EXECUTION ENGINE
# ==============================================================================
# This playbook orchestrates the deployment and configuration of Sonatype Nexus.
# It acts as a strict declarative engine: Optional roles are ONLY executed if
# their corresponding feature flag is enabled in the variables.

- name: Nexus as Code - Full Lifecycle Deployment
  hosts: nexus_servers
  gather_facts: true
  
  pre_tasks:
    - name: Verify Supported OS Family
      ansible.builtin.assert:
        that: ansible_os_family in ['Debian', 'RedHat']
        fail_msg: "Unsupported OS. Only Debian and RedHat families are supported."
        quiet: true
      tags: ['always']

  roles:
    # --------------------------------------------------------------------------
    # BASE FLOW (Always Execute)
    # --------------------------------------------------------------------------
    - role: preflight
      become: true
      tags: ['preflight', 'base']
    
    - role: nexus_deploy
      become: true
      tags: ['nexus', 'base']
      
    - role: nexus_bootstrap
      become: false  # API calls over localhost:8081
      tags: ['bootstrap', 'base']

    # --------------------------------------------------------------------------
    # OPTIONAL FLOW (Feature Flagged)
    # --------------------------------------------------------------------------
    - role: storage
      become: false
      when: features.storage.enabled | default(false) | bool
      tags: ['storage', 'optional']

    - role: nexus_blobstores
      become: false
      when: features.blobstores.enabled | default(false) | bool
      tags: ['blobstores', 'optional']

    - role: nexus_repositories
      become: false
      when: features.repositories.enabled | default(false) | bool
      tags: ['repositories', 'optional']

    - role: nexus_cluster
      become: true
      when: features.cluster.enabled | default(false) | bool
      tags: ['cluster', 'optional']

    - role: loadbalancer
      become: true
      when: features.loadbalancer.enabled | default(false) | bool
      tags: ['loadbalancer', 'optional']

    - role: scaling_engine
      become: true
      when: features.scaling.enabled | default(false) | bool
      tags: ['scaling', 'optional']

    - role: backup
      become: true
      when: features.backup.enabled | default(false) | bool
      tags: ['backup', 'optional']

    - role: monitoring
      become: false
      when: features.monitoring.enabled | default(false) | bool
      tags: ['monitoring', 'optional']
