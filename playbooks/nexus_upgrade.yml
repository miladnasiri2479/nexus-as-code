---
###############################################################################
# Nexus as Code - Upgrade Playbook
# ============================================================================
# Upgrade Nexus to a new version with automatic backup and rollback.
#
# Usage:
#   ansible-playbook -i inventories/production/inventory.yml playbooks/nexus_upgrade.yml \
#     -e "nexus_version=3.73.0"
###############################################################################

- name: Upgrade Nexus Repository Manager
  hosts: nexus
  become: true
  gather_facts: true

  roles:
    - role: nexus_upgrade
      tags: [nexus, upgrade]
