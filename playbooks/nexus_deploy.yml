---
###############################################################################
# Nexus as Code - Main Deployment Playbook
# ============================================================================
# Full deployment: OS prep → Java → Nexus → Config → Repos → Security → Validate
#
# Usage:
#   ansible-playbook -i inventories/production/inventory.yml playbooks/nexus_deploy.yml
###############################################################################

- name: Deploy Nexus Repository Manager
  hosts: nexus
  become: true
  gather_facts: true

  pre_tasks:
    - name: Validate configuration
      ansible.builtin.assert:
        that:
          - nexus_admin_password != "" or not nexus_enabled
          - nexus_version != ""
        fail_msg: "nexus_admin_password and nexus_version are required"
      when: nexus_enabled | default(true)
      tags: [always]

  roles:
    - role: common
      when: nexus_enabled | default(true)
      tags: [common, prerequisites]

    - role: java
      when: nexus_enabled | default(true) and not nexus_docker_enabled | default(false)
      tags: [java]

    - role: minio
      when: nexus_enabled | default(true) and nexus_minio_enabled | default(false)
      tags: [minio]

    - role: minio_bucket
      when: nexus_enabled | default(true) and nexus_minio_enabled | default(false)
      tags: [minio, buckets]

    - role: nexus_install
      when: nexus_enabled | default(true)
      tags: [nexus, install]

    - role: nexus_config
      when: nexus_enabled | default(true)
      tags: [nexus, config]

    - role: nexus_blobstores
      when: nexus_enabled | default(true)
      tags: [nexus, blobstores]

    - role: nexus_repos
      when: nexus_enabled | default(true)
      tags: [nexus, repos]

    - role: nexus_repos_groups
      when: nexus_enabled | default(true)
      tags: [nexus, repo-groups]

    - role: nexus_cleanup
      when: nexus_enabled | default(true)
      tags: [nexus, cleanup]

    - role: nexus_security
      when: nexus_enabled | default(true)
      tags: [nexus, security]

    - role: nexus_proxy
      when: nexus_enabled | default(true) and nexus_proxy_enabled | default(false)
      tags: [nexus, proxy]

    - role: nexus_validation
      when: nexus_enabled | default(true) and nexus_validation_enabled | default(true)
      tags: [nexus, validation]

  post_tasks:
    - name: Display deployment summary
      ansible.builtin.debug:
        msg:
          - "Nexus Repository Manager deployed successfully"
          - "URL: http://{{ nexus_fqdn }}:{{ nexus_port }}/"
          - "Version: {{ nexus_version }}"
          - "Edition: {{ nexus_edition }}"
      when: nexus_enabled | default(true)
      tags: [always]
