---
###############################################################################
# Nexus as Code - Install Only Playbook
# ============================================================================
# Install Nexus without configuring repos, security, etc.
#
# Usage:
#   ansible-playbook -i inventories/production/inventory.yml playbooks/nexus_install.yml
###############################################################################

- name: Install Nexus Repository Manager
  hosts: nexus
  become: true
  gather_facts: true

  roles:
    - role: common
      tags: [common, prerequisites]

    - role: java
      when: not nexus_docker_enabled | default(false)
      tags: [java]

    - role: nexus_install
      when: not nexus_docker_enabled | default(false)
      tags: [nexus, install]
