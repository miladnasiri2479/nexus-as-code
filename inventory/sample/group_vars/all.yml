---
# ==============================================================================
# NEXUS AS CODE - SINGLE SOURCE OF TRUTH (GROUP VARS / ALL.YML)
# ==============================================================================

# ==========================================
# 1. CORE NEXUS SETTINGS
# ==========================================
nexus:
  hostname: "nexus.mycompany.local"
  version: "3.68.0"
  admin_password: "SuperSecretPassword123!" # Required: Min 8 chars
  admin_user: "admin"
  http_port: 8081
  data_dir: "/opt/nexus-data"
  network_name: "nexus_network"
  container_name: "nexus"
  anonymous_access: false

# ==========================================
# 2. TRAEFIK (EDGE PROXY)
# ==========================================
traefik:
  enabled: true
  version: "v2.10"
  domain: "{{ nexus.hostname }}"
  letsencrypt: false
  email: "admin@mycompany.local"
  dashboard_enabled: false
  config_dir: "/opt/traefik"

tls:
  enabled: "{{ traefik.letsencrypt }}"
  cert_email: "{{ traefik.email }}"

# ==========================================
# 3. STORAGE & BLOBSTORES
# ==========================================
# storage block used by validation role
storage:
  type: "file" # local, s3, or minio

# blobstores block used by blobstores role API
blobstores:
  - name: "default"
    type: "file"
  - name: "docker-blobstore"
    type: "file"
  - name: "maven-blobstore"
    type: "file"
  
  # Example S3 integration:
  # - name: "s3-backup-blob"
  #   type: "s3"
  #   bucket: "my-bucket"
  #   region: "us-east-1"
  #   access_key: "AKIA..."
  #   secret_key: "SECRET..."

# ==========================================
# 4. REPOSITORIES CATALOG OVERRIDES
# ==========================================
# Enable or disable repos here. They pull logic from roles/repositories/vars/catalog.yml
repositories:
  docker_hub:
    enabled: true
    blobstore: "docker-blobstore"
  
  maven_central:
    enabled: true
    blobstore: "maven-blobstore"
  
  npm_registry:
    enabled: false
  
  pypi_org:
    enabled: false
