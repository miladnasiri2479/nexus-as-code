---
nexus_users: []
nexus_users_delete_unmanaged: false
nexus_admin_user: admin
nexus_admin_password: ""
nexus_validate_certs: true
nexus_port: 8081
nexus_listen_address: "0.0.0.0"
nexus_api_scheme: http
nexus_api_version: v1
nexus_api_timeout: 30
nexus_api_retries: 3
nexus_api_retry_delay: 5
nexus_users_url: "{{ nexus_api_base_url }}/security/users"
nexus_users_run_once: false
nexus_users_delegate_to: ""
nexus_users_diff: true
nexus_no_log: true
nexus_http_proxy: ""
nexus_https_proxy: ""
nexus_no_proxy: ""
