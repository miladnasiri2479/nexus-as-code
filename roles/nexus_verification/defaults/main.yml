---
nexus_verification_enabled: true
nexus_verification_checks:
  - api
  - repos
  - blobstores
  - users
  - roles
  - cleanup
  - groups
nexus_verification_expected_repos: 0
nexus_verification_expected_blobstores: 0
nexus_verification_expected_users: 0
nexus_admin_user: admin
nexus_admin_password: ""
nexus_validate_certs: true
nexus_port: 8081
nexus_listen_address: "0.0.0.0"
nexus_context_path: "/"
nexus_api_scheme: http
nexus_api_version: v1
nexus_api_timeout: 30
nexus_api_retries: 3
nexus_api_retry_delay: 5
nexus_api_base_url: "{{ nexus_api_scheme }}://{{ nexus_listen_address }}:{{ nexus_port }}{{ nexus_context_path }}service/rest/{{ nexus_api_version }}"
nexus_verification_fail_on_error: true
nexus_repos: []
nexus_blobstores: []
nexus_users: []
nexus_roles: []
nexus_cleanup_policies: []
nexus_repo_groups: []
nexus_verification_run_once: false
nexus_verification_delegate_to: ""
nexus_http_proxy: ""
nexus_https_proxy: ""
nexus_no_proxy: ""
