    - "'groups' in nexus_verification_checks"
    - _verify_groups is success
  tags: [nexus, verification, groups]

- name: Verification | Check missing groups
  ansible.builtin.set_fact:
    _verify_missing_groups: "{{ nexus_repo_groups | default([]) | map(attribute='name') | select('not in', _verify_groups.json | default([]) | map(attribute='name') | list) | list }}"
  when:
    - nexus_verification_enabled
    - "'groups' in nexus_verification_checks"
    - _verify_groups is success
  tags: [nexus, verification, groups]

- name: Verification | Report missing groups
  ansible.builtin.set_fact:
    _verification_errors: "{{ _verification_errors + ['MISSING_GROUPS: ' + (_verify_missing_groups | join(', '))] }}"
  when:
    - nexus_verification_enabled
    - "'groups' in nexus_verification_checks"
    - (_verify_missing_groups | default([])) | length > 0
  tags: [nexus, verification, groups]

- name: Verification | Display results
  ansible.builtin.debug:
    msg:
      - "[VERIFICATION] Results:"
      - "{{ _verification_results | default([]) | list }}"
      - "Errors: {{ _verification_errors | default([]) | length }}"
  when: nexus_verification_enabled
  tags: [nexus, verification, report]

- name: Verification | Fail on errors
  ansible.builtin.fail:
    msg: "[VERIFICATION] FAILED: {{ _verification_errors | join(', ') }}"
  when:
    - nexus_verification_enabled
    - nexus_verification_fail_on_error
    - (_verification_errors | default([])) | length > 0
  tags: [nexus, verification, report]

- name: Verification | Display success
  ansible.builtin.debug:
    msg: "[VERIFICATION] PASSED — all checks successful"
  when:
    - nexus_verification_enabled
    - (_verification_errors | default([])) | length == 0
  tags: [nexus, verification, report]
