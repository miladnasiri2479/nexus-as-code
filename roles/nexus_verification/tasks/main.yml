  ignore_errors: true
  tags: [nexus, verification, groups]

- name: Verification | Report groups count
  ansible.builtin.set_fact:
    _verification_results: "{{ _verification_results + ['GROUPS: ' + (_verify_groups.json | default([]) | length | string) + ' found'] }}"
  when:
