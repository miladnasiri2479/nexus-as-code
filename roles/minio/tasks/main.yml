---
- name: MinIO | Display role info
  ansible.builtin.debug:
    msg: "Installing MinIO Server {{ nexus_minio_version }}"
  tags: [minio]

- name: MinIO | Create MinIO group
  ansible.builtin.group:
    name: "{{ nexus_minio_group }}"
    state: present
  tags: [minio, user]

- name: MinIO | Create MinIO user
  ansible.builtin.user:
    name: "{{ nexus_minio_user }}"
    group: "{{ nexus_minio_group }}"
    shell: /sbin/nologin
    system: true
    create_home: false
    state: present
  tags: [minio, user]

- name: MinIO | Create directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "{{ nexus_minio_user }}"
    group: "{{ nexus_minio_group }}"
    mode: "0755"
  loop:
    - "{{ nexus_minio_data_dir }}"
    - "{{ nexus_minio_config_dir }}"
    - "{{ nexus_minio_cert_dir }}"
  tags: [minio, dirs]

- name: MinIO | Check if MinIO is installed
  ansible.builtin.stat:
    path: "{{ nexus_minio_install_dir }}/minio"
  register: minio_binary_stat
  tags: [minio, install]

- name: MinIO | Download MinIO
  ansible.builtin.get_url:
    url: "https://dl.min.io/server/minio/release/linux-amd64/archive/minio.{{ nexus_minio_version }}"
    dest: "{{ nexus_minio_install_dir }}/minio"
    mode: "0755"
    owner: root
    group: root
  when: not minio_binary_stat.stat.exists
  tags: [minio, install]

- name: MinIO | Create environment file
  ansible.builtin.template:
    src: minio-env.j2
    dest: /etc/default/minio
    owner: root
    group: root
    mode: "0640"
  notify: Restart minio
  tags: [minio, config]

- name: MinIO | Create systemd unit
  ansible.builtin.template:
    src: minio.service.j2
    dest: /etc/systemd/system/minio.service
    owner: root
    group: root
    mode: "0644"
  notify:
    - Reload systemd
    - Restart minio
  tags: [minio, service]

- name: MinIO | Reload systemd
  ansible.builtin.systemd:
    daemon_reload: true
  tags: [minio, service]

- name: MinIO | Enable and start MinIO
  ansible.builtin.systemd:
    name: minio
    state: "{{ nexus_minio_service_state }}"
    enabled: "{{ nexus_minio_service_enabled }}"
  tags: [minio, service]

- name: MinIO | Wait for MinIO to start
  ansible.builtin.uri:
    url: "http://localhost:{{ nexus_minio_port }}/minio/health/live"
    method: GET
    status_code: 200
  register: minio_health
  until: minio_health.status == 200
  retries: 10
  delay: 5
  when: nexus_minio_service_state == "started"
  tags: [minio, verify]
