---
# roles/repositories/tasks/manage_repo.yml

- name: Check if repository exists in catalog
  ansible.builtin.assert:
    that:
      - loaded_catalog.repo_catalog[repo_item.key] is defined
    fail_msg: "[ERROR] Repository key '{{ repo_item.key }}' is enabled but not found in vars/catalog.yml"
    quiet: true

- name: Load catalog definition for current repo
  ansible.builtin.set_fact:
    catalog_def: "{{ loaded_catalog.repo_catalog[repo_item.key] }}"

- name: Prepare Final Payload (Merge User Overrides)
  ansible.builtin.set_fact:
    final_payload: >-
      {{
        catalog_def.api_payload | combine({
          'storage': {
            'blobStoreName': repo_item.value.blobstore | default(catalog_def.api_payload.storage.blobStoreName)
          }
        }, recursive=True)
      }}

- name: Create Repository (If Missing)
  ansible.builtin.uri:
    url: "http://localhost:{{ nexus.http_port | default(8081) }}/service/rest/v1/repositories/{{ catalog_def.format }}/{{ catalog_def.type }}"
    method: POST
    user: "{{ nexus.admin_user | default('admin') }}"
    password: "{{ nexus.admin_password }}"
    force_basic_auth: true
    body_format: json
    body: "{{ final_payload }}"
    status_code: 201
  when: final_payload.name not in existing_repo_names
  no_log: true

- name: Update Repository (If Exists)
  ansible.builtin.uri:
    url: "http://localhost:{{ nexus.http_port | default(8081) }}/service/rest/v1/repositories/{{ catalog_def.format }}/{{ catalog_def.type }}/{{ final_payload.name }}"
    method: PUT
    user: "{{ nexus.admin_user | default('admin') }}"
    password: "{{ nexus.admin_password }}"
    force_basic_auth: true
    body_format: json
    body: "{{ final_payload }}"
    status_code: 204
  when: final_payload.name in existing_repo_names
  no_log: true
  changed_when: true
