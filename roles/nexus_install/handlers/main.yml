---
###############################################################################
# nexus_install — handlers
#
# Service management handlers. Triggered by task notifications.
###############################################################################

- name: Reload systemd
  ansible.builtin.systemd:
    daemon_reload: true
  listen: Reload systemd

- name: Restart nexus
  ansible.builtin.systemd:
    name: "{{ nexus_service_name }}"
    state: restarted
    daemon_reload: true
  when:
    - nexus_service_state == 'started'
    - nexus_install_method == 'binary'
  listen: Restart nexus
