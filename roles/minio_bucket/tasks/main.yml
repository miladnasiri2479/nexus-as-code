---
- name: MinIO Bucket | Display role info
  ansible.builtin.debug:
    msg: "Creating MinIO buckets ({{ nexus_minio_buckets | length }} defined)"
  tags: [minio, buckets]

- name: MinIO Bucket | Install mc client
  ansible.builtin.get_url:
    url: "https://dl.min.io/client/mc/release/linux-amd64/mc"
    dest: /usr/local/bin/mc
    mode: "0755"
    owner: root
    group: root
  tags: [minio, mc]

- name: MinIO Bucket | Configure mc alias
  ansible.builtin.shell:
    cmd: |
      set -o pipefail
      /usr/local/bin/mc alias set {{ nexus_minio_user }} http://localhost:{{ nexus_minio_port }} {{ nexus_minio_access_key }} {{ nexus_minio_secret_key }}
    executable: /bin/bash
  register: mc_alias_result
  changed_when: "'added' in mc_alias_result.stdout or 'Modified' in mc_alias_result.stdout"
  tags: [minio, mc]

- name: MinIO Bucket | List existing buckets
  ansible.builtin.shell:
    cmd: |
      set -o pipefail
      /usr/local/bin/mc ls {{ nexus_minio_user }}/ 2>/dev/null | awk '{print $NF}' || echo ""
    executable: /bin/bash
  register: mc_buckets_list
  changed_when: false
  tags: [minio, buckets]

- name: MinIO Bucket | Create buckets
  ansible.builtin.shell:
    cmd: |
      set -o pipefail
      /usr/local/bin/mc mb {{ nexus_minio_user }}/{{ item.name }}
    executable: /bin/bash
  loop: "{{ nexus_minio_buckets }}"
  loop_control:
    label: "{{ item.name }}"
  when: item.name not in mc_buckets_list.stdout_lines
  register: mc_mb_result
  changed_when: "'created' in mc_mb_result.stdout"
  tags: [minio, buckets]

- name: MinIO Bucket | Enable versioning
  ansible.builtin.shell:
    cmd: |
      set -o pipefail
      /usr/local/bin/mc version enable {{ nexus_minio_user }}/{{ item.name }}
    executable: /bin/bash
  loop: "{{ nexus_minio_buckets }}"
  loop_control:
    label: "{{ item.name }}"
  when: item.versioning | default(false) | bool
  register: mc_version_result
  changed_when: "'versioning is enabled' in mc_version_result.stdout"
  tags: [minio, buckets]

- name: MinIO Bucket | Verify bucket creation
  ansible.builtin.shell:
    cmd: |
      set -o pipefail
      /usr/local/bin/mc ls {{ nexus_minio_user }}/{{ item.name }} >/dev/null 2>&1
    executable: /bin/bash
  loop: "{{ nexus_minio_buckets }}"
  loop_control:
    label: "{{ item.name }}"
  changed_when: false
  tags: [minio, verify]
