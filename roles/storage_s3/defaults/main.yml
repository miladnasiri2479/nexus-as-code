---
nexus_storage_s3_enabled: false
nexus_storage_s3_region: us-east-1
nexus_storage_s3_bucket_prefix: nexus
nexus_storage_s3_access_key_id: ""
nexus_storage_s3_secret_access_key: ""
nexus_storage_s3_endpoint: ""
nexus_storage_s3_path_style_access: false
nexus_storage_s3_max_error_retry: "5"
nexus_storage_s3_encryption: ""
nexus_storage_s3_sse_kms_key_id: ""
nexus_storage_s3_validate_connectivity: true
nexus_admin_user: admin
nexus_admin_password: ""
nexus_validate_certs: true
nexus_port: 8081
nexus_listen_address: "0.0.0.0"
nexus_api_scheme: http
nexus_api_version: v1
nexus_api_timeout: 30
nexus_api_retries: 3
nexus_api_retry_delay: 5
nexus_storage_s3_url: "{{ nexus_api_base_url }}/blobstores/s3"
nexus_http_proxy: ""
nexus_https_proxy: ""
nexus_no_proxy: ""
