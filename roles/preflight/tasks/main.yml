---
# roles/preflight/tasks/main.yml

- name: Populate service facts
  ansible.builtin.service_facts:

- name: Check if Docker is installed and running
  ansible.builtin.assert:
    that:
      - "'docker.service' in ansible_facts.services"
      - "ansible_facts.services['docker.service'].state == 'running'"
    fail_msg: "[ERROR] Docker daemon is not installed or not running. Please install Docker before proceeding."
    success_msg: "[OK] Docker is installed and running."
    quiet: true
  ignore_errors: true
  register: docker_check

- name: Set Docker installation fact
  ansible.builtin.set_fact:
    docker_is_running: "{{ docker_check is not failed }}"

# If Docker is already running, the ports might be legitimately used by our own previous Nexus/Traefik containers.
# We only do a hard fail on ports if this is a pristine environment (Docker not running).
# Container port conflicts will be natively and deterministically caught by docker_container module later.
- name: Check if required ports are available (Pristine Check)
  ansible.builtin.wait_for:
    port: "{{ item }}"
    state: stopped
    timeout: 3
    msg: "[ERROR] Port {{ item }} is already in use by a non-docker process."
  loop:
    - "{{ preflight.nexus_port }}"
    - "{{ preflight.traefik_http_port }}"
    - "{{ preflight.traefik_https_port }}"
  ignore_errors: true
  register: port_check
  no_log: true
  when: not docker_is_running

- name: Assert port availability
  ansible.builtin.assert:
    that:
      - port_check is not failed
    fail_msg: "[ERROR] One or more required ports ({{ preflight.nexus_port }}, {{ preflight.traefik_http_port }}, {{ preflight.traefik_https_port }}) are already in use."
    success_msg: "[OK] All required ports are free."
    quiet: true
  when: not docker_is_running

- name: Get directory stats for data path
  ansible.builtin.stat:
    path: "{{ preflight.nexus_data_path | dirname }}"
  register: data_path_stat

- name: Fail if parent directory of data path does not exist
  ansible.builtin.assert:
    that:
      - data_path_stat.stat.exists
      - data_path_stat.stat.isdir
    fail_msg: "[ERROR] The parent directory for nexus data ({{ preflight.nexus_data_path | dirname }}) does not exist."
    quiet: true

- name: Check minimum disk space
  ansible.builtin.assert:
    that:
      - item.size_available > (preflight.min_disk_space_gb * 1024 * 1024 * 1024)
    fail_msg: >
      [ERROR] Insufficient disk space on {{ item.mount }}.
      Requires at least {{ preflight.min_disk_space_gb }}GB available.
      Current available: {{ (item.size_available / 1024 / 1024 / 1024) | round(2) }}GB.
    success_msg: "[OK] Sufficient disk space available on {{ item.mount }}."
    quiet: true
  loop: "{{ ansible_mounts }}"
  when: >
    (preflight.nexus_data_path | dirname) | regex_search('^' ~ item.mount)
    and (item.mount == '/' or (preflight.nexus_data_path | dirname) != '/')
