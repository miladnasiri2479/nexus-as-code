---
- name: Nexus Config | Display role info
  ansible.builtin.debug:
    msg: "Configuring Nexus Repository Manager"
  tags: [nexus, config]

- name: Nexus Config | Ensure Nexus is running
  ansible.builtin.uri:
    url: "http://{{ nexus_listen_address }}:{{ nexus_port }}//service/rest/v1/status"
    method: GET
    status_code: 200
  register: nexus_status_check
  retries: 10
  delay: 5
  until: nexus_status_check.status == 200
  tags: [nexus, config]

- name: Nexus Config | Read admin password from container
  ansible.builtin.command: docker exec nexus cat /nexus-data/admin.password
  register: _admin_password_file
  changed_when: false
  when:
    - nexus_install_method | default('binary') == 'docker'
    - nexus_docker_admin_password_enabled | default(false) | bool
  tags: [nexus, config]

- name: Nexus Config | Set admin password from container
  ansible.builtin.set_fact:
    nexus_admin_password: "{{ _admin_password_file.stdout }}"
  when:
    - nexus_install_method | default('binary') == 'docker'
    - nexus_docker_admin_password_enabled | default(false) | bool
    - _admin_password_file.rc == 0
    - _admin_password_file.stdout | length > 0
  tags: [nexus, config]

- name: Nexus Config | Write nexus.properties
  ansible.builtin.template:
    src: nexus.properties.j2
    dest: "{{ nexus_current_link }}/etc/nexus.properties"
    owner: "{{ nexus_runas_user }}"
    group: "{{ nexus_runas_group }}"
    mode: "0644"
  notify: Restart nexus
  when: nexus_install_method | default('binary') == 'binary'
  tags: [nexus, config]

- name: Nexus Config | Write logback configuration
  ansible.builtin.template:
    src: logback.xml.j2
    dest: "{{ nexus_data_dir }}/etc/logback/logback.xml"
    owner: "{{ nexus_runas_user }}"
    group: "{{ nexus_runas_group }}"
    mode: "0644"
  notify: Restart nexus
  when: nexus_install_method | default('binary') == 'binary'
  tags: [nexus, config]

- name: Nexus Config | Write JVM options
  ansible.builtin.template:
    src: nexus.vmoptions.j2
    dest: "{{ nexus_data_dir }}/etc/nexus.vmoptions"
    owner: "{{ nexus_runas_user }}"
    group: "{{ nexus_runas_group }}"
    mode: "0644"
  notify: Restart nexus
  when: nexus_install_method | default('binary') == 'binary'
  tags: [nexus, config]
