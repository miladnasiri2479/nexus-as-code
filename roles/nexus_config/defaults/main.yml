---
nexus_listen_address: "0.0.0.0"
nexus_port: 8081
nexus_https_enabled: false
nexus_https_port: 8443
nexus_context_path: "/"
nexus_data_dir: /var/nexus/data
nexus_temp_dir: /var/nexus/tmp
nexus_work_dir: /var/nexus/scratch
nexus_enable_nexus_orient: true
nexus_smtp_host: ""
nexus_smtp_port: 25
nexus_smtp_from_address: ""
nexus_smtp_username: ""
nexus_smtp_password: ""
nexus_smtp_ssl: false
nexus_smtp_starttls: false
nexus_proxy_enabled: false
nexus_http_proxy_host: ""
nexus_http_proxy_port: 80
nexus_http_proxy_username: ""
nexus_http_proxy_password: ""
nexus_https_proxy_host: ""
nexus_https_proxy_port: 443
nexus_https_proxy_username: ""
nexus_https_proxy_password: ""
nexus_no_proxy_hosts: ""
nexus_jvm_memory: "-Xms2703m -Xmx2703m"
nexus_jvm_additional: ""
nexus_extra_jvm_opts: ""
nexus_max_direct_memory: "2703m"
nexus_log_level: INFO
nexus_log_pattern: "%d{ISO8601} [%t] %-5level %logger{36} - %msg%n"
nexus_log_max_size: "10 MB"
nexus_log_max_files: 5
nexus_runas_user: nexus
nexus_runas_group: nexus
nexus_current_link: /opt/sonatype/current
nexus_service_name: nexus
nexus_service_state: started
nexus_admin_user: admin
nexus_admin_password: ""
nexus_validate_certs: true
nexus_api_timeout: 30
nexus_api_retries: 10
nexus_api_delay: 5
