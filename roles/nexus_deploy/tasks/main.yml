---
# roles/nexus_deploy/tasks/main.yml

- name: Install Docker and dependencies (Debian/Ubuntu)
  ansible.builtin.apt:
    name:
      - docker.io
      - python3-docker
    state: present
    update_cache: true
    cache_valid_time: 3600
  when: ansible_os_family == 'Debian'

- name: Install Docker and dependencies (RedHat/CentOS)
  ansible.builtin.dnf:
    name:
      - docker
      - python3-docker
    state: present
  when: ansible_os_family == 'RedHat'

- name: Ensure Docker service is running and enabled
  ansible.builtin.systemd:
    name: docker
    state: started
    enabled: true

- name: Create dedicated Docker network
  community.docker.docker_network:
    name: "{{ nexus.network_name | default('nexus-net') }}"
    state: present

- name: Ensure Nexus persistent data directory exists
  ansible.builtin.file:
    path: "{{ nexus.data_dir | default('/opt/nexus-data') }}"
    state: directory
    owner: "200"  # Sonatype Nexus container runs as UID 200 by default
    group: "200"
    mode: '0755'

- name: Deploy Sonatype Nexus Container
  community.docker.docker_container:
    name: "{{ nexus.container_name | default('nexus') }}"
    image: "sonatype/nexus3:{{ nexus.version | default('latest') }}"
    state: started
    restart_policy: always
    networks:
      - name: "{{ nexus.network_name | default('nexus-net') }}"
    ports:
      - "{{ nexus.http_port | default(8081) }}:8081"
    volumes:
      - "{{ nexus.data_dir | default('/opt/nexus-data') }}:/nexus-data"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/service/rest/v1/status"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s  # Nexus takes a while to boot initially
  register: nexus_container_state
  notify: Restart Nexus Container

- name: Wait until Nexus API is fully ready (Validation)
  ansible.builtin.uri:
    url: "http://localhost:{{ nexus.http_port | default(8081) }}/service/rest/v1/status"
    method: GET
    status_code: 200
  register: nexus_status
  until: nexus_status.status == 200
  retries: 10
  delay: 15
  ignore_errors: true
  changed_when: false

- name: Assert Nexus is running and healthy
  ansible.builtin.assert:
    that:
      - nexus_status is not failed
      - nexus_status.status == 200
    fail_msg: "[ERROR] Nexus failed to become ready after 10 attempts. Check Docker logs."
    success_msg: "[OK] Nexus is running and healthy!"
    quiet: true
