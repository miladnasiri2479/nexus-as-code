---
- name: Roles | Display role info
  ansible.builtin.debug:
    msg: "Configuring {{ nexus_roles | length }} role(s)"
  tags: [nexus, roles]

- name: Roles | Assert admin password is set
  ansible.builtin.assert:
    that:
      - nexus_admin_password | default('') | length > 0
    fail_msg: "[ROLES] ERROR: Missing required variable 'nexus_admin_password'."
  tags: [nexus, roles, validate]

- name: Roles | Get existing roles
  ansible.builtin.uri:
    url: "{{ nexus_roles_url }}"
    method: GET
    user: "{{ nexus_admin_user }}"
    password: "{{ nexus_admin_password }}"
    force_basic_auth: true
    return_content: true
    validate_certs: "{{ nexus_validate_certs }}"
    timeout: "{{ nexus_api_timeout }}"
  environment:
    HTTP_PROXY: "{{ nexus_http_proxy | default(omit) }}"
    HTTPS_PROXY: "{{ nexus_https_proxy | default(omit) }}"
    NO_PROXY: "{{ nexus_no_proxy | default(omit) }}"
  register: _role_list
  until: _role_list.status == 200
  retries: "{{ nexus_api_retries }}"
  delay: "{{ nexus_api_retry_delay }}"
  delegate_to: "{{ nexus_roles_delegate_to | default(omit) }}"
  run_once: "{{ nexus_roles_run_once }}"
  changed_when: false
  tags: [nexus, roles, query]

- name: Roles | Set existing roles fact
  ansible.builtin.set_fact:
    _existing_roles: "{{ _role_list.json | default([]) | map(attribute='roleId') | list }}"
  tags: [nexus, roles, query]

- name: Roles | Create roles
  ansible.builtin.uri:
    url: "{{ nexus_roles_url }}"
    method: POST
    body_format: json
    body:
      roleId: "{{ item.roleId | default(item.name) }}"
      name: "{{ item.name }}"
      description: "{{ item.description | default('') }}"
      privileges: "{{ item.privileges | default([]) }}"
      roles: "{{ item.roles | default([]) }}"
      source: "{{ item.source | default('default') }}"
    user: "{{ nexus_admin_user }}"
    password: "{{ nexus_admin_password }}"
    force_basic_auth: true
    status_code: [200, 201]
    validate_certs: "{{ nexus_validate_certs }}"
    timeout: "{{ nexus_api_timeout }}"
  environment:
    HTTP_PROXY: "{{ nexus_http_proxy | default(omit) }}"
    HTTPS_PROXY: "{{ nexus_https_proxy | default(omit) }}"
    NO_PROXY: "{{ nexus_no_proxy | default(omit) }}"
  register: _role_create
  until: _role_create.status in [200, 201]
  retries: "{{ nexus_api_retries }}"
  delay: "{{ nexus_api_retry_delay }}"
  delegate_to: "{{ nexus_roles_delegate_to | default(omit) }}"
  run_once: "{{ nexus_roles_run_once }}"
  diff: "{{ nexus_roles_diff }}"
  no_log: "{{ nexus_no_log }}"
  loop: "{{ nexus_roles }}"
  loop_control:
    label: "Create: {{ item.roleId | default(item.name) }}"
    pause: 0
  when: (item.roleId | default(item.name)) not in _existing_roles
  tags: [nexus, roles, create]

- name: Roles | Update existing roles
  ansible.builtin.uri:
    url: "{{ nexus_roles_url }}/{{ item.roleId | default(item.name) }}"
    method: PUT
    body_format: json
    body:
      roleId: "{{ item.roleId | default(item.name) }}"
      name: "{{ item.name }}"
      description: "{{ item.description | default('') }}"
      privileges: "{{ item.privileges | default([]) }}"
      roles: "{{ item.roles | default([]) }}"
      source: "{{ item.source | default('default') }}"
    user: "{{ nexus_admin_user }}"
    password: "{{ nexus_admin_password }}"
    force_basic_auth: true
    status_code: [200, 204]
    validate_certs: "{{ nexus_validate_certs }}"
    timeout: "{{ nexus_api_timeout }}"
  environment:
    HTTP_PROXY: "{{ nexus_http_proxy | default(omit) }}"
    HTTPS_PROXY: "{{ nexus_https_proxy | default(omit) }}"
    NO_PROXY: "{{ nexus_no_proxy | default(omit) }}"
  register: _role_update
  until: _role_update.status in [200, 204]
  retries: "{{ nexus_api_retries }}"
  delay: "{{ nexus_api_retry_delay }}"
  delegate_to: "{{ nexus_roles_delegate_to | default(omit) }}"
  run_once: "{{ nexus_roles_run_once }}"
  diff: "{{ nexus_roles_diff }}"
  loop: "{{ nexus_roles }}"
  loop_control:
    label: "Update: {{ item.roleId | default(item.name) }}"
    pause: 0
  when: (item.roleId | default(item.name)) in _existing_roles
  tags: [nexus, roles, update]

- name: Roles | Delete unmanaged roles
  ansible.builtin.uri:
    url: "{{ nexus_roles_url }}/{{ item }}"
    method: DELETE
    user: "{{ nexus_admin_user }}"
    password: "{{ nexus_admin_password }}"
    force_basic_auth: true
    status_code: [200, 204]
    validate_certs: "{{ nexus_validate_certs }}"
    timeout: "{{ nexus_api_timeout }}"
  environment:
    HTTP_PROXY: "{{ nexus_http_proxy | default(omit) }}"
    HTTPS_PROXY: "{{ nexus_https_proxy | default(omit) }}"
    NO_PROXY: "{{ nexus_no_proxy | default(omit) }}"
  register: _role_delete
  until: _role_delete.status in [200, 204]
  retries: "{{ nexus_api_retries }}"
  delay: "{{ nexus_api_retry_delay }}"
  delegate_to: "{{ nexus_roles_delegate_to | default(omit) }}"
  run_once: "{{ nexus_roles_run_once }}"
  diff: "{{ nexus_roles_diff }}"
  loop: "{{ _existing_roles }}"
  loop_control:
    label: "Delete: {{ item }}"
    pause: 0
  when:
    - nexus_roles_delete_unmanaged
    - item not in (nexus_roles | map(attribute='roleId', default='name') | list)
    - item not in nexus_roles_builtin
  tags: [nexus, roles, delete]

- name: Roles | Display summary
  ansible.builtin.debug:
    msg:
      - "[ROLES] Configuration Complete"
      - "  Defined: {{ nexus_roles | length }}"
      - "  Already existed: {{ _existing_roles | intersect(nexus_roles | map(attribute='roleId', default='name') | list) | length }}"
  tags: [nexus, roles, summary]
