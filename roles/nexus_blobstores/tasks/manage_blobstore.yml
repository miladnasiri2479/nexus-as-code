---
# roles/nexus_blobstores/tasks/manage_blobstore.yml

- name: Prepare File Blobstore Payload
  ansible.builtin.set_fact:
    bs_payload:
      name: "{{ bs_item.key }}"
      path: "{{ nexus.data_dir | default('/opt/nexus-data') }}/blobs/{{ bs_item.key }}"
      softQuota: null
    api_type: "file"
  when: storage.type == 'file'

- name: Prepare S3/MinIO Blobstore Payload
  ansible.builtin.set_fact:
    bs_payload:
      name: "{{ bs_item.key }}"
      softQuota: null
      bucketConfiguration:
        bucket:
          region: "{{ storage.region | default('us-east-1') }}"
          name: "{{ storage.bucket }}"
          prefix: "{{ bs_item.key }}" # Use blobstore name as prefix inside the bucket
          expiration: -1
        encryption:
          encryptionType: "s3Managed"
          encryptionKey: ""
        bucketSecurity:
          accessKeyId: "{{ storage.access_key }}"
          secretAccessKey: "{{ storage.secret_key }}"
          role: ""
          sessionToken: ""
        advancedBucketConnection:
          endpoint: "{{ storage.endpoint | default('') }}"
          signerType: ""
          forcePathStyle: "{{ true if storage.type == 'minio' else false }}"
          maxConnectionPoolSize: 50
    api_type: "s3"
  when: storage.type in ['s3', 'minio']

- name: Create Blobstore (If Missing)
  ansible.builtin.uri:
    url: "http://localhost:{{ nexus.http_port | default(8081) }}/service/rest/v1/blobstores/{{ api_type }}"
    method: POST
    user: "{{ nexus.admin_user | default('admin') }}"
    password: "{{ nexus.admin_password }}"
    force_basic_auth: true
    body_format: json
    body: "{{ bs_payload }}"
    status_code: [204, 201]
  when: bs_item.key not in existing_blobstore_names
  no_log: true

- name: Update Blobstore (If Exists & Config Differs)
  ansible.builtin.uri:
    url: "http://localhost:{{ nexus.http_port | default(8081) }}/service/rest/v1/blobstores/{{ api_type }}/{{ bs_item.key }}"
    method: PUT
    user: "{{ nexus.admin_user | default('admin') }}"
    password: "{{ nexus.admin_password }}"
    force_basic_auth: true
    body_format: json
    body: "{{ bs_payload }}"
    status_code: 204
  when: bs_item.key in existing_blobstore_names
  changed_when: true
  no_log: true
