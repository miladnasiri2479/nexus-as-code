---
###############################################################################
# nexus_repos — tasks/main.yml
#
# Create and manage repositories via Nexus REST API.
# Supports all formats. All values from variables — no hardcoded values.
# Supports: check_mode, diff, async, delegate_to, run_once, no_log
###############################################################################

- name: Repos | Display role info
  ansible.builtin.debug:
    msg: "Configuring {{ nexus_repos | length }} repository(ies)"
  tags: [nexus, repos]

###############################################################################
# VALIDATE
###############################################################################

- name: Repos | Assert admin password is set
  ansible.builtin.assert:
    that:
      - nexus_admin_password | default('') | length > 0
    fail_msg: >-
      [REPOS] ERROR: Missing required variable 'nexus_admin_password'.
  tags: [nexus, repos, validate]

- name: Repos | Validate repository formats
  ansible.builtin.assert:
    that:
      - item.format in nexus_repo_valid_formats
    fail_msg: >-
      [REPOS] ERROR: Invalid format '{{ item.format }}' for repository '{{ item.name }}'.
      Valid formats: {{ nexus_repo_valid_formats | join(', ') }}
  loop: "{{ nexus_repos }}"
  loop_control:
    label: "Repo: {{ item.name }}"
    pause: 0
  when: nexus_repos | length > 0
  tags: [nexus, repos, validate]

- name: Repos | Validate repository types
  ansible.builtin.assert:
    that:
      - item.type in nexus_repo_valid_types
    fail_msg: >-
      [REPOS] ERROR: Invalid type '{{ item.type }}' for repository '{{ item.name }}'.
      Valid types: {{ nexus_repo_valid_types | join(', ') }}
  loop: "{{ nexus_repos }}"
  loop_control:
    label: "Repo: {{ item.name }}"
    pause: 0
  when: nexus_repos | length > 0
  tags: [nexus, repos, validate]

- name: Repos | Validate proxy repos have remote_url
  ansible.builtin.assert:
    that:
      - item.remote_url | default('') | length > 0
    fail_msg: >-
      [REPOS] ERROR: Proxy repository '{{ item.name }}' missing required remote_url.
  loop: "{{ nexus_repos }}"
  loop_control:
    label: "Repo: {{ item.name }}"
    pause: 0
  when:
    - nexus_repos | length > 0
    - item.type == 'proxy'
  tags: [nexus, repos, validate]

###############################################################################
# GET EXISTING
###############################################################################

- name: Repos | Get existing repositories
  ansible.builtin.uri:
    url: "{{ nexus_repos_list_url }}"
    method: GET
    user: "{{ nexus_admin_user }}"
    password: "{{ nexus_admin_password }}"
    force_basic_auth: true
    return_content: true
    validate_certs: "{{ nexus_validate_certs }}"
    timeout: "{{ nexus_api_timeout }}"
  environment:
    HTTP_PROXY: "{{ nexus_http_proxy | default(omit) }}"
    HTTPS_PROXY: "{{ nexus_https_proxy | default(omit) }}"
    NO_PROXY: "{{ nexus_no_proxy | default(omit) }}"
  register: _repo_list
  until: _repo_list.status == 200
  retries: "{{ nexus_api_retries }}"
  delay: "{{ nexus_api_retry_delay }}"
  delegate_to: "{{ nexus_repos_delegate_to | default(omit) }}"
  run_once: "{{ nexus_repos_run_once }}"
  changed_when: false
  tags: [nexus, repos, query]

- name: Repos | Set existing repos fact
  ansible.builtin.set_fact:
    _existing_repos: "{{ _repo_list.json | default([]) | map(attribute='name') | list }}"
  tags: [nexus, repos, query]

- name: Repos | Display existing repos
  ansible.builtin.debug:
    msg: "Existing: {{ _existing_repos }}"
  tags: [nexus, repos, query]

###############################################################################
# RESOLVE BLOBSTORES
###############################################################################

- name: Repos | Resolve blobstore for each repo
  ansible.builtin.set_fact:
    _repos_with_blobstore: >-
      {{
        nexus_repos | default([]) | map('combine', {
          'blob_store_name': item.blob_store_name | default(
            nexus_repo_blobstore_map[item.name | default('')] | default(
              nexus_format_blobstore_defaults[item.format | default('')] | default('default')
            )
          )
        }) | list
      }}
  when: nexus_repos | length > 0
  tags: [nexus, repos, mapping]

###############################################################################
# CREATE REPOSITORIES
###############################################################################

- name: Repos | Create repositories
  ansible.builtin.uri:
    url: "{{ nexus_repos_create_url }}/{{ item.format }}/{{ item.type }}"
    method: POST
    body_format: json
    body: "{{ item }}"
    user: "{{ nexus_admin_user }}"
    password: "{{ nexus_admin_password }}"
    force_basic_auth: true
    status_code: [200, 201]
    validate_certs: "{{ nexus_validate_certs }}"
    timeout: "{{ nexus_api_timeout }}"
  environment:
    HTTP_PROXY: "{{ nexus_http_proxy | default(omit) }}"
    HTTPS_PROXY: "{{ nexus_https_proxy | default(omit) }}"
    NO_PROXY: "{{ nexus_no_proxy | default(omit) }}"
  register: _repo_create
  until: _repo_create.status in [200, 201]
  retries: "{{ nexus_api_retries }}"
  delay: "{{ nexus_api_retry_delay }}"
  delegate_to: "{{ nexus_repos_delegate_to | default(omit) }}"
  run_once: "{{ nexus_repos_run_once }}"
  diff: "{{ nexus_repos_diff }}"
  no_log: "{{ nexus_no_log }}"
  loop: "{{ _repos_with_blobstore | default(nexus_repos) }}"
  loop_control:
    label: "Create: {{ item.name }} ({{ item.format }}/{{ item.type }})"
    pause: 0
  when: item.name not in _existing_repos
  tags: [nexus, repos, create]

###############################################################################
# UPDATE REPOSITORIES
###############################################################################

- name: Repos | Update existing repositories
  ansible.builtin.uri:
    url: "{{ nexus_repos_create_url }}/{{ item.format }}/{{ item.type }}/{{ item.name }}"
    method: PUT
    body_format: json
    body: "{{ item }}"
    user: "{{ nexus_admin_user }}"
    password: "{{ nexus_admin_password }}"
    force_basic_auth: true
    status_code: [200, 204]
    validate_certs: "{{ nexus_validate_certs }}"
    timeout: "{{ nexus_api_timeout }}"
  environment:
    HTTP_PROXY: "{{ nexus_http_proxy | default(omit) }}"
    HTTPS_PROXY: "{{ nexus_https_proxy | default(omit) }}"
    NO_PROXY: "{{ nexus_no_proxy | default(omit) }}"
  register: _repo_update
  until: _repo_update.status in [200, 204]
  retries: "{{ nexus_api_retries }}"
  delay: "{{ nexus_api_retry_delay }}"
  delegate_to: "{{ nexus_repos_delegate_to | default(omit) }}"
  run_once: "{{ nexus_repos_run_once }}"
  diff: "{{ nexus_repos_diff }}"
  no_log: "{{ nexus_no_log }}"
  loop: "{{ _repos_with_blobstore | default(nexus_repos) }}"
  loop_control:
    label: "Update: {{ item.name }}"
    pause: 0
  when: item.name in _existing_repos
  tags: [nexus, repos, update]

###############################################################################
# DELETE UNMANAGED
###############################################################################

- name: Repos | Delete unmanaged repositories
  ansible.builtin.uri:
    url: "{{ nexus_repos_list_url }}/{{ item }}"
    method: DELETE
    user: "{{ nexus_admin_user }}"
    password: "{{ nexus_admin_password }}"
    force_basic_auth: true
    status_code: [200, 204]
    validate_certs: "{{ nexus_validate_certs }}"
    timeout: "{{ nexus_api_timeout }}"
  environment:
    HTTP_PROXY: "{{ nexus_http_proxy | default(omit) }}"
    HTTPS_PROXY: "{{ nexus_https_proxy | default(omit) }}"
    NO_PROXY: "{{ nexus_no_proxy | default(omit) }}"
  register: _repo_delete
  until: _repo_delete.status in [200, 204]
  retries: "{{ nexus_api_retries }}"
  delay: "{{ nexus_api_retry_delay }}"
  delegate_to: "{{ nexus_repos_delegate_to | default(omit) }}"
  run_once: "{{ nexus_repos_run_once }}"
  diff: "{{ nexus_repos_diff }}"
  loop: "{{ _existing_repos }}"
  loop_control:
    label: "Delete: {{ item }}"
    pause: 0
  when:
    - nexus_repos_delete_unmanaged
    - item not in (nexus_repos | map(attribute='name') | list)
    - item not in nexus_repos_expected
  tags: [nexus, repos, delete]

###############################################################################
# SUMMARY
###############################################################################

- name: Repos | Display summary
  ansible.builtin.debug:
    msg:
      - "[REPOS] Configuration Complete"
      - "  Defined: {{ nexus_repos | length }}"
      - "  Already existed: {{ _existing_repos | intersect(nexus_repos | map(attribute='name') | list) | length }}"
      - "  Created: {{ nexus_repos | length - _existing_repos | intersect(nexus_repos | map(attribute='name') | list) | length }}"
      - "  Deleted: {{ _existing_repos | difference(nexus_repos | map(attribute='name') | list) | difference(nexus_repos_expected) | length if nexus_repos_delete_unmanaged else 0 }}"
  tags: [nexus, repos, summary]
