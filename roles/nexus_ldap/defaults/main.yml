---
###############################################################################
# nexus_ldap — defaults
###############################################################################

nexus_ldap_enabled: false
nexus_ldap:
  name: "Corporate LDAP"
  protocol: ldap
  host: ""
  port: 389
  base_dn: ""
  bind_dn: ""
  bind_password: ""
  user_base_dn: ""
  user_object_class: "inetOrgPerson"
  user_id_attribute: "uid"
  user_real_name_attribute: "cn"
  user_email_attribute: "mail"
  usermemberOfAttribute: "memberOf"
  group_base_dn: ""
  group_object_class: "groupOfNames"
  group_id_attribute: "cn"
  group_member_attribute: "member"
  group_memberof_attribute: ""
  authentication_method: simple
  ssl: false
  start_tls: false

nexus_ldap_group_mapping: []

nexus_admin_user: admin
nexus_admin_password: ""
nexus_validate_certs: true
nexus_port: 8081
nexus_listen_address: "0.0.0.0"
nexus_context_path: "/"
nexus_api_scheme: http
nexus_api_version: v1
nexus_api_timeout: 30
nexus_api_retries: 3
nexus_api_retry_delay: 5

nexus_api_base_url: "{{ nexus_api_scheme }}://{{ nexus_listen_address }}:{{ nexus_port }}{{ nexus_context_path }}service/rest/{{ nexus_api_version }}"
nexus_ldap_servers_url: "{{ nexus_api_base_url }}/security/ldap/servers"
nexus_ldap_realms_url: "{{ nexus_api_base_url }}/security/realms/active"

nexus_ldap_run_once: false
nexus_ldap_delegate_to: ""
nexus_ldap_diff: true
nexus_no_log: true
nexus_http_proxy: ""
nexus_https_proxy: ""
nexus_no_proxy: ""
