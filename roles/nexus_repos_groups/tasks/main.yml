---
###############################################################################
# nexus_repos_groups — tasks/main.yml
#
# Create and manage repository groups via Nexus REST API.
# All values from variables — no hardcoded values.
# Supports: check_mode, diff, async, delegate_to, run_once, no_log
###############################################################################

- name: Repo Groups | Display role info
  ansible.builtin.debug:
    msg: "Configuring {{ nexus_repo_groups | length }} repository group(s)"
  tags: [nexus, repo-groups]

###############################################################################
# VALIDATE
###############################################################################

- name: Repo Groups | Assert admin password is set
  ansible.builtin.assert:
    that:
      - nexus_admin_password | default('') | length > 0
    fail_msg: >-
      [REPO-GROUPS] ERROR: Missing required variable 'nexus_admin_password'.
  tags: [nexus, repo-groups, validate]

- name: Repo Groups | Validate group formats
  ansible.builtin.assert:
    that:
      - item.format in nexus_repo_group_valid_formats
    fail_msg: >-
      [REPO-GROUPS] ERROR: Invalid format '{{ item.format }}' for group '{{ item.name }}'.
      Valid formats: {{ nexus_repo_group_valid_formats | join(', ') }}
  loop: "{{ nexus_repo_groups }}"
  loop_control:
    label: "Group: {{ item.name }}"
    pause: 0
  when: nexus_repo_groups | length > 0
  tags: [nexus, repo-groups, validate]

- name: Repo Groups | Validate member repos exist
  ansible.builtin.assert:
    that:
      - item.member_repos | default([]) | length > 0
    fail_msg: >-
      [REPO-GROUPS] ERROR: Group '{{ item.name }}' has no member_repos defined.
  loop: "{{ nexus_repo_groups }}"
  loop_control:
    label: "Group: {{ item.name }}"
    pause: 0
  when: nexus_repo_groups | length > 0
  tags: [nexus, repo-groups, validate]

###############################################################################
# GET EXISTING
###############################################################################

- name: Repo Groups | Get existing groups
  ansible.builtin.uri:
    url: "{{ nexus_repo_groups_list_url }}"
    method: GET
    user: "{{ nexus_admin_user }}"
    password: "{{ nexus_admin_password }}"
    force_basic_auth: true
    return_content: true
    validate_certs: "{{ nexus_validate_certs }}"
    timeout: "{{ nexus_api_timeout }}"
  environment:
    HTTP_PROXY: "{{ nexus_http_proxy | default(omit) }}"
    HTTPS_PROXY: "{{ nexus_https_proxy | default(omit) }}"
    NO_PROXY: "{{ nexus_no_proxy | default(omit) }}"
  register: _group_list
  until: _group_list.status == 200
  retries: "{{ nexus_api_retries }}"
  delay: "{{ nexus_api_retry_delay }}"
  delegate_to: "{{ nexus_repo_groups_delegate_to | default(omit) }}"
  run_once: "{{ nexus_repo_groups_run_once }}"
  changed_when: false
  tags: [nexus, repo-groups, query]

- name: Repo Groups | Set existing groups fact
  ansible.builtin.set_fact:
    _existing_groups: "{{ _group_list.json | default([]) | map(attribute='name') | list }}"
  tags: [nexus, repo-groups, query]

- name: Repo Groups | Display existing groups
  ansible.builtin.debug:
    msg: "Existing: {{ _existing_groups }}"
  tags: [nexus, repo-groups, query]

###############################################################################
# CREATE GROUPS
###############################################################################

- name: Repo Groups | Create repository groups
  ansible.builtin.uri:
    url: "{{ nexus_repo_groups_create_url }}/{{ item.format }}"
    method: POST
    body_format: json
    body: "{{ item }}"
    user: "{{ nexus_admin_user }}"
    password: "{{ nexus_admin_password }}"
    force_basic_auth: true
    status_code: [200, 201]
    validate_certs: "{{ nexus_validate_certs }}"
    timeout: "{{ nexus_api_timeout }}"
  environment:
    HTTP_PROXY: "{{ nexus_http_proxy | default(omit) }}"
    HTTPS_PROXY: "{{ nexus_https_proxy | default(omit) }}"
    NO_PROXY: "{{ nexus_no_proxy | default(omit) }}"
  register: _group_create
  until: _group_create.status in [200, 201]
  retries: "{{ nexus_api_retries }}"
  delay: "{{ nexus_api_retry_delay }}"
  delegate_to: "{{ nexus_repo_groups_delegate_to | default(omit) }}"
  run_once: "{{ nexus_repo_groups_run_once }}"
  diff: "{{ nexus_repo_groups_diff }}"
  no_log: "{{ nexus_no_log }}"
  loop: "{{ nexus_repo_groups }}"
  loop_control:
    label: "Create: {{ item.name }}"
    pause: 0
  when: item.name not in _existing_groups
  tags: [nexus, repo-groups, create]

###############################################################################
# UPDATE GROUPS
###############################################################################

- name: Repo Groups | Update existing groups
  ansible.builtin.uri:
    url: "{{ nexus_repo_groups_create_url }}/{{ item.format }}/{{ item.name }}"
    method: PUT
    body_format: json
    body: "{{ item }}"
    user: "{{ nexus_admin_user }}"
    password: "{{ nexus_admin_password }}"
    force_basic_auth: true
    status_code: [200, 204]
    validate_certs: "{{ nexus_validate_certs }}"
    timeout: "{{ nexus_api_timeout }}"
  environment:
    HTTP_PROXY: "{{ nexus_http_proxy | default(omit) }}"
    HTTPS_PROXY: "{{ nexus_https_proxy | default(omit) }}"
    NO_PROXY: "{{ nexus_no_proxy | default(omit) }}"
  register: _group_update
  until: _group_update.status in [200, 204]
  retries: "{{ nexus_api_retries }}"
  delay: "{{ nexus_api_retry_delay }}"
  delegate_to: "{{ nexus_repo_groups_delegate_to | default(omit) }}"
  run_once: "{{ nexus_repo_groups_run_once }}"
  diff: "{{ nexus_repo_groups_diff }}"
  no_log: "{{ nexus_no_log }}"
  loop: "{{ nexus_repo_groups }}"
  loop_control:
    label: "Update: {{ item.name }}"
    pause: 0
  when: item.name in _existing_groups
  tags: [nexus, repo-groups, update]

###############################################################################
# DELETE UNMANAGED
###############################################################################

- name: Repo Groups | Delete unmanaged groups
  ansible.builtin.uri:
    url: "{{ nexus_repo_groups_list_url }}/{{ item }}"
    method: DELETE
    user: "{{ nexus_admin_user }}"
    password: "{{ nexus_admin_password }}"
    force_basic_auth: true
    status_code: [200, 204]
    validate_certs: "{{ nexus_validate_certs }}"
    timeout: "{{ nexus_api_timeout }}"
  environment:
    HTTP_PROXY: "{{ nexus_http_proxy | default(omit) }}"
    HTTPS_PROXY: "{{ nexus_https_proxy | default(omit) }}"
    NO_PROXY: "{{ nexus_no_proxy | default(omit) }}"
  register: _group_delete
  until: _group_delete.status in [200, 204]
  retries: "{{ nexus_api_retries }}"
  delay: "{{ nexus_api_retry_delay }}"
  delegate_to: "{{ nexus_repo_groups_delegate_to | default(omit) }}"
  run_once: "{{ nexus_repo_groups_run_once }}"
  diff: "{{ nexus_repo_groups_diff }}"
  loop: "{{ _existing_groups }}"
  loop_control:
    label: "Delete: {{ item }}"
    pause: 0
  when:
    - nexus_repo_groups_delete_unmanaged
    - item not in (nexus_repo_groups | map(attribute='name') | list)
  tags: [nexus, repo-groups, delete]

###############################################################################
# SUMMARY
###############################################################################

- name: Repo Groups | Display summary
  ansible.builtin.debug:
    msg:
      - "[REPO-GROUPS] Configuration Complete"
      - "  Defined: {{ nexus_repo_groups | length }}"
      - "  Already existed: {{ _existing_groups | intersect(nexus_repo_groups | map(attribute='name') | list) | length }}"
      - "  Created: {{ nexus_repo_groups | length - _existing_groups | intersect(nexus_repo_groups | map(attribute='name') | list) | length }}"
  tags: [nexus, repo-groups, summary]
