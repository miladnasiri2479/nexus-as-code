---
###############################################################################
# nexus_repos_groups — defaults
#
# Repository group configuration. All values from group_vars.
# No hardcoded values in tasks — everything reads from this file.
###############################################################################

# ──────────────────────────────────────────────────────────────────────────────
# REPOSITORY GROUPS
# ──────────────────────────────────────────────────────────────────────────────

# List of repository groups to create.
# Type: list[dict]
nexus_repo_groups: []

# Delete groups not defined in nexus_repo_groups.
# WARNING: destructive.
# Type: bool
nexus_repo_groups_delete_unmanaged: false

# Valid group formats.
# Type: list[string]
nexus_repo_group_valid_formats:
  - maven2
  - docker
  - npm
  - pypi
  - helm
  - go
  - nuget

# ──────────────────────────────────────────────────────────────────────────────
# API CONNECTION
# ──────────────────────────────────────────────────────────────────────────────

# Admin credentials.
# Type: string
nexus_admin_user: admin
nexus_admin_password: ""

# Validate SSL certificates.
# Type: bool
nexus_validate_certs: true

# Nexus API connection.
# Type: string/int
nexus_port: 8081
nexus_listen_address: "0.0.0.0"
nexus_context_path: "/"
nexus_api_scheme: http
nexus_api_version: v1
nexus_api_timeout: 30

# API retry settings.
# Type: int
nexus_api_retries: 3
nexus_api_retry_delay: 5

# Computed API base URL.
# Type: string (derived)
nexus_api_base_url: "{{ nexus_api_scheme }}://{{ nexus_listen_address }}:{{ nexus_port }}{{ nexus_context_path }}service/rest/{{ nexus_api_version }}"

# ──────────────────────────────────────────────────────────────────────────────
# COMPUTED URLs
# ──────────────────────────────────────────────────────────────────────────────

# Group API URLs.
# Type: string (derived)
nexus_repo_groups_list_url: "{{ nexus_api_base_url }}/repositories/group"
nexus_repo_groups_create_url: "{{ nexus_api_base_url }}/repositories/group"

# ──────────────────────────────────────────────────────────────────────────────
# OPERATIONAL SETTINGS
# ──────────────────────────────────────────────────────────────────────────────

# Run once in multi-host deployments.
# Type: bool
nexus_repo_groups_run_once: false

# Delegate to specific host.
# Type: string
nexus_repo_groups_delegate_to: ""

# Async support.
# Type: int
nexus_repo_groups_async: 0
nexus_repo_groups_poll: 0

# Diff mode.
# Type: bool
nexus_repo_groups_diff: true

# Log sensitive variables.
# Type: bool
nexus_no_log: true

# Proxy environment.
# Type: string
nexus_http_proxy: ""
nexus_https_proxy: ""
nexus_no_proxy: ""
