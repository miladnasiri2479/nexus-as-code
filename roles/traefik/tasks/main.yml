---
# roles/traefik/tasks/main.yml

- name: Create Traefik configuration directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: '0755'
  loop:
    - "{{ traefik.config_dir }}"
    - "{{ traefik.config_dir }}/dynamic"

- name: Ensure acme.json exists with correct permissions (Required by Traefik)
  ansible.builtin.file:
    path: "{{ traefik.config_dir }}/acme.json"
    state: touch
    mode: '0600'
    modification_time: preserve
    access_time: preserve

- name: Template Traefik static configuration
  ansible.builtin.template:
    src: traefik.yml.j2
    dest: "{{ traefik.config_dir }}/traefik.yml"
  notify: Restart Traefik Container

- name: Template Traefik dynamic configuration (Nexus Routing)
  ansible.builtin.template:
    src: dynamic_conf.yml.j2
    dest: "{{ traefik.config_dir }}/dynamic/nexus.yml"
  notify: Restart Traefik Container

- name: Deploy Traefik Docker Container
  community.docker.docker_container:
    name: traefik
    image: "traefik:{{ traefik.version }}"
    state: started
    restart_policy: unless-stopped
    networks:
      - name: "{{ nexus.network_name | default('nexus_network') }}"
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - "/var/run/docker.sock:/var/run/docker.sock:ro"
      - "{{ traefik.config_dir }}/traefik.yml:/traefik.yml:ro"
      - "{{ traefik.config_dir }}/dynamic:/dynamic:ro"
      - "{{ traefik.config_dir }}/acme.json:/acme.json"
