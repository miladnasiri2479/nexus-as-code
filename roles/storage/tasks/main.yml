---
- name: Storage | Display role info
  ansible.builtin.debug:
    msg: "Configuring storage backend: {{ nexus_storage_type }}"
  tags: [storage]

- name: Storage | Validate storage type
  ansible.builtin.assert:
    that:
      - nexus_storage_type in ['file', 's3']
    fail_msg: "[STORAGE] ERROR: nexus_storage_type must be 'file' or 's3'. Got: {{ nexus_storage_type }}"
  tags: [storage, validate]

- name: Storage | Set storage facts
  ansible.builtin.set_fact:
    _storage_file_enabled: "{{ nexus_storage_type == 'file' }}"
    _storage_s3_enabled: "{{ nexus_storage_type == 's3' }}"
    _storage_minio_enabled: "{{ nexus_storage_minio.enabled | default(false) }}"
  tags: [storage, init]

- name: Storage | Display summary
  ansible.builtin.debug:
    msg:
      - "[STORAGE] Configuration Complete"
      - "  Type: {{ nexus_storage_type }}"
      - "  Blobstores: {{ nexus_blobstores | length }}"
      - "  Buckets: {{ nexus_buckets | length }}"
  tags: [storage, summary]
