---
# roles/nexus_bootstrap/tasks/main.yml

# 1. Wait for Nexus API readiness
- name: Include reusable Nexus API wait task
  ansible.builtin.include_tasks: wait_for_nexus.yml

# Check if auth has already been changed to target password
- name: Check if admin password is already configured
  ansible.builtin.uri:
    url: "http://localhost:{{ nexus.http_port | default(8081) }}/service/rest/v1/security/users?userId=admin"
    method: GET
    user: "admin"
    password: "{{ nexus.admin_password }}"
    force_basic_auth: true
    status_code: [200, 401, 403]
  register: admin_auth_check
  changed_when: false
  no_log: true

# 2. Retrieve initial admin password from container (via host mount)
- name: Retrieve initial admin password from container volume
  ansible.builtin.slurp:
    src: "{{ nexus.data_dir | default('/opt/nexus-data') }}/admin.password"
  register: initial_password_file
  when: admin_auth_check.status in [401, 403]
  ignore_errors: true

- name: Set initial password fact
  ansible.builtin.set_fact:
    initial_password: "{{ initial_password_file['content'] | b64decode | trim }}"
  when: admin_auth_check.status in [401, 403] and not initial_password_file.failed
  no_log: true

# 3. Change admin password using API
- name: Change admin password using API
  ansible.builtin.uri:
    url: "http://localhost:{{ nexus.http_port | default(8081) }}/service/rest/v1/security/users/admin/change-password"
    method: PUT
    user: "admin"
    password: "{{ initial_password }}"
    force_basic_auth: true
    headers:
      Content-Type: "text/plain"
      accept: "application/json"
    body: "{{ nexus.admin_password }}"
    body_format: raw
    status_code: 204
  when: admin_auth_check.status in [401, 403] and initial_password is defined
  no_log: true

# 4. Disable anonymous access
- name: Get current anonymous access state
  ansible.builtin.uri:
    url: "http://localhost:{{ nexus.http_port | default(8081) }}/service/rest/v1/security/anonymous"
    method: GET
    user: "admin"
    password: "{{ nexus.admin_password }}"
    force_basic_auth: true
    status_code: 200
  register: anonymous_state
  changed_when: false
  no_log: true

- name: Update anonymous access
  ansible.builtin.uri:
    url: "http://localhost:{{ nexus.http_port | default(8081) }}/service/rest/v1/security/anonymous"
    method: PUT
    user: "admin"
    password: "{{ nexus.admin_password }}"
    force_basic_auth: true
    body_format: json
    body:
      enabled: "{{ nexus.anonymous_access | default(false) }}"
      userId: "anonymous"
      realmName: "NexusAuthorizingRealm"
    status_code: 200
  when: anonymous_state.json.enabled != nexus.anonymous_access | default(false)
  no_log: true

# 5. Set base URL for Nexus (Via Scripts API as no standard v1 REST endpoint exists)
# Note: Requires `nexus.scripts.allowCreation=true` in nexus.properties to work in modern Nexus versions.
- name: Check if Scripting API is accessible for Base URL (Optional)
  ansible.builtin.uri:
    url: "http://localhost:{{ nexus.http_port | default(8081) }}/service/rest/v1/script"
    method: GET
    user: "admin"
    password: "{{ nexus.admin_password }}"
    force_basic_auth: true
    status_code: [200, 403, 404]
  register: script_api_check
  changed_when: false
  no_log: true
  ignore_errors: true

- name: Configure Base URL via Script API
  ansible.builtin.uri:
    url: "http://localhost:{{ nexus.http_port | default(8081) }}/service/rest/v1/script"
    method: POST
    user: "{{ nexus.admin_user | default('admin') }}"
    password: "{{ nexus.admin_password }}"
    force_basic_auth: true
    body_format: json
    body:
      name: "set-base-url"
      type: "groovy"
      content: |
        def currentUrl = core.baseUrl()
        if (currentUrl != '{{ nexus.base_url }}') {
            core.baseUrl('{{ nexus.base_url }}')
            return "changed"
        }
        return "ok"
    status_code: [204, 201]
  when: script_api_check.status == 200 and nexus.base_url != ""
  ignore_errors: true
  no_log: true

- name: Execute Base URL Script
  ansible.builtin.uri:
    url: "http://localhost:{{ nexus.http_port | default(8081) }}/service/rest/v1/script/set-base-url/run"
    method: POST
    user: "{{ nexus.admin_user | default('admin') }}"
    password: "{{ nexus.admin_password }}"
    force_basic_auth: true
    headers:
      Content-Type: "text/plain"
    status_code: 200
  register: base_url_script_result
  when: script_api_check.status == 200 and nexus.base_url != ""
  ignore_errors: true
  no_log: true
  changed_when: base_url_script_result.json.result | default('') == 'changed'

- name: Cleanup Base URL Script
  ansible.builtin.uri:
    url: "http://localhost:{{ nexus.http_port | default(8081) }}/service/rest/v1/script/set-base-url"
    method: DELETE
    user: "{{ nexus.admin_user | default('admin') }}"
    password: "{{ nexus.admin_password }}"
    force_basic_auth: true
    status_code: 204
  when: script_api_check.status == 200 and nexus.base_url != ""
  ignore_errors: true
  no_log: true
  changed_when: false

# 6. Enable required realms
- name: Get current active security realms
  ansible.builtin.uri:
    url: "http://localhost:{{ nexus.http_port | default(8081) }}/service/rest/v1/security/realms/active"
    method: GET
    user: "admin"
    password: "{{ nexus.admin_password }}"
    force_basic_auth: true
    status_code: 200
  register: active_realms_api
  changed_when: false
  no_log: true

- name: Combine required realms with active realms
  ansible.builtin.set_fact:
    merged_realms: "{{ (active_realms_api.json + nexus.active_realms) | unique }}"

- name: Enable required realms (Docker Bearer Token, Authenticating Realm)
  ansible.builtin.uri:
    url: "http://localhost:{{ nexus.http_port | default(8081) }}/service/rest/v1/security/realms/active"
    method: PUT
    user: "admin"
    password: "{{ nexus.admin_password }}"
    force_basic_auth: true
    body_format: json
    body: "{{ merged_realms }}"
    status_code: 204
  when: merged_realms | sort != active_realms_api.json | sort
  no_log: true

# 7. Post-Deployment QA Validation
- name: Run Nexus Configuration Validation
  ansible.builtin.include_tasks: validate.yml
