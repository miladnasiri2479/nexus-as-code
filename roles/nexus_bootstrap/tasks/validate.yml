---
# roles/nexus_bootstrap/tasks/validate.yml
# Post-execution validation to ensure the bootstrap role correctly applied all settings.

- name: Validate 1 & 4 - Nexus API is stable
  ansible.builtin.uri:
    url: "http://localhost:{{ nexus.http_port | default(8081) }}/service/rest/v1/status"
    method: GET
    status_code: 200
  register: val_api_status
  changed_when: false

- name: Validate 2 - Admin password changed successfully (Authentication Check)
  ansible.builtin.uri:
    url: "http://localhost:{{ nexus.http_port | default(8081) }}/service/rest/v1/security/users?userId=admin"
    method: GET
    user: "admin"
    password: "{{ nexus.admin_password }}"
    force_basic_auth: true
    status_code: 200
  register: val_auth
  changed_when: false
  no_log: true

- name: Validate 3 - Anonymous access configuration
  ansible.builtin.uri:
    url: "http://localhost:{{ nexus.http_port | default(8081) }}/service/rest/v1/security/anonymous"
    method: GET
    user: "admin"
    password: "{{ nexus.admin_password }}"
    force_basic_auth: true
    status_code: 200
    return_content: true
  register: val_anon
  changed_when: false
  no_log: true

- name: Assert Anonymous Access State
  ansible.builtin.assert:
    that:
      - val_anon.json.enabled == (nexus.anonymous_access | default(false))
    fail_msg: "[ERROR] Validation Failed: Anonymous access state does not match desired configuration."
    success_msg: "[OK] Validation Passed: Anonymous access is correctly configured."
    quiet: true

- name: Validate 5 - Security realms are enabled
  ansible.builtin.uri:
    url: "http://localhost:{{ nexus.http_port | default(8081) }}/service/rest/v1/security/realms/active"
    method: GET
    user: "admin"
    password: "{{ nexus.admin_password }}"
    force_basic_auth: true
    status_code: 200
  register: val_realms
  changed_when: false
  no_log: true

- name: Assert Security Realms Configuration
  ansible.builtin.assert:
    that:
      - item in val_realms.json
    fail_msg: "[ERROR] Validation Failed: Required realm '{{ item }}' is missing."
    success_msg: "[OK] Validation Passed: Realm '{{ item }}' is active."
    quiet: true
  loop: "{{ nexus.active_realms }}"
