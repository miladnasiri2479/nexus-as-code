---
- name: MinIO | Display role info
  ansible.builtin.debug:
    msg: "Installing MinIO Server {{ nexus_minio_version }}"
  tags: [storage, minio]

- name: MinIO | Assert credentials are set
  ansible.builtin.assert:
    that:
      - nexus_minio_access_key | default('') | length > 0
      - nexus_minio_secret_key | default('') | length > 0
    fail_msg: "[MINIO] ERROR: MinIO requires access_key and secret_key."
  tags: [storage, minio, validate]

- name: MinIO | Create MinIO group
  ansible.builtin.group:
    name: "{{ nexus_minio_group }}"
    state: present
  tags: [storage, minio, user]

- name: MinIO | Create MinIO user
  ansible.builtin.user:
    name: "{{ nexus_minio_user }}"
    group: "{{ nexus_minio_group }}"
    shell: /sbin/nologin
    system: true
    create_home: false
    state: present
  tags: [storage, minio, user]

- name: MinIO | Create directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "{{ nexus_minio_user }}"
    group: "{{ nexus_minio_group }}"
    mode: "0755"
  loop:
    - "{{ nexus_minio_data_dir }}"
    - "{{ nexus_minio_config_dir }}"
    - "{{ nexus_minio_cert_dir }}"
  tags: [storage, minio, dirs]

- name: MinIO | Check if MinIO is installed
  ansible.builtin.stat:
    path: "{{ nexus_minio_install_dir }}/minio"
  register: _minio_binary
  tags: [storage, minio, install]

- name: MinIO | Download MinIO binary
  ansible.builtin.get_url:
    url: "https://dl.min.io/server/minio/release/linux-amd64/archive/minio.{{ nexus_minio_version }}"
    dest: "{{ nexus_minio_install_dir }}/minio"
    mode: "0755"
    owner: root
    group: root
  when: not _minio_binary.stat.exists
  tags: [storage, minio, install]

- name: MinIO | Write environment file
  ansible.builtin.template:
    src: minio-env.j2
    dest: /etc/default/minio
    owner: root
    group: root
    mode: "0640"
  notify: Restart minio
  tags: [storage, minio, config]

- name: MinIO | Write systemd unit
  ansible.builtin.template:
    src: minio.service.j2
    dest: /etc/systemd/system/minio.service
    owner: root
    group: root
    mode: "0644"
  notify:
    - Reload systemd minio
    - Restart minio
  tags: [storage, minio, service]

- name: MinIO | Reload systemd daemon
  ansible.builtin.systemd:
    daemon_reload: true
  tags: [storage, minio, service]

- name: MinIO | Enable and start MinIO
  ansible.builtin.systemd:
    name: minio
    state: "{{ nexus_minio_service_state }}"
    enabled: "{{ nexus_minio_service_enabled }}"
  tags: [storage, minio, service]

- name: MinIO | Wait for health
  ansible.builtin.uri:
    url: "http://localhost:{{ nexus_minio_port }}/minio/health/live"
    method: GET
    status_code: 200
  register: _minio_health
  until: _minio_health.status == 200
  retries: 10
  delay: 5
  when: nexus_minio_service_state == "started"
  tags: [storage, minio, verify]

- name: MinIO | Display summary
  ansible.builtin.debug:
    msg:
      - "[MINIO] Configuration Complete"
      - "  Version: {{ nexus_minio_version }}"
      - "  Port: {{ nexus_minio_port }}"
      - "  Console: {{ nexus_minio_console_port }}"
  tags: [storage, minio, summary]
